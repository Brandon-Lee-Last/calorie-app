# Builds an installable Android APK on GitHub's machines, so no Android SDK is needed on your PC.
# Download it from the run's page under "Artifacts". It is signed with the template's debug key,
# which is fine for testing on your own phone but not for Google Play.
#
# Set the repository variable EXPO_PUBLIC_API_URL (Settings > Secrets and variables > Actions >
# Variables) to your deployed https backend. Release builds refuse plain http, so without it the
# app works offline only.
name: Android build

on:
  push:
    branches: [main, 'claude/**']
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --ci

  apk:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install
      - name: Give Gradle enough memory
        # Replace the template's line in place: the generated file does not end with a newline, so appending would
        # glue this onto its last setting.
        run: sed -i 's/^org\.gradle\.jvmargs=.*/org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g/' android/gradle.properties
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the release APK
        working-directory: android
        # Phones from the last several years are all arm64; one architecture keeps the build quick and the APK small.
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
      - uses: actions/upload-artifact@v4
        with:
          name: calorie-app-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error
      - name: Check what is inside the APK
        run: |
          apk=$(ls android/app/build/outputs/apk/release/*.apk)
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          badging=$("$tools/aapt2" dump badging "$apk")
          echo "$badging" | grep -E "^(package|targetSdkVersion|uses-permission|native-code|application-label):"
          if echo "$badging" | grep -qE "RECORD_AUDIO|READ_PHONE_STATE|SYSTEM_ALERT_WINDOW"; then echo "A blocked permission is back"; exit 1; fi
          "$tools/apksigner" verify --print-certs "$apk" | grep -E "certificate (DN|SHA-256)"
          unzip -l "$apk" > contents.txt
          grep -iE "tflite|tensorflow|index\.android\.bundle|libhermes|libreactnative" contents.txt
          # The JavaScript bundle and the TFLite runtime must be inside.
          grep -q "assets/index.android.bundle" contents.txt
          grep -qE "lib/arm64-v8a/libtensorflowlite_jni\.so" contents.txt
          # So must the model. Release builds shorten resource paths (it lands as res/<x>.tflite), so match its checksum.
          want=$(sha256sum assets/nutrition_v1.tflite | cut -d' ' -f1)
          found=no
          for f in $(grep -oE "res/[^ ]+\.tflite" contents.txt); do
            if [ "$(unzip -p "$apk" "$f" | sha256sum | cut -d' ' -f1)" = "$want" ]; then echo "Model: $f"; found=yes; fi
          done
          [ "$found" = yes ]
